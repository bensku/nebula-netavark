# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  build:
    desc: Builds binaries for current OS and arch
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
    cmds:
      - go build -ldflags "-X github.com/bensku/nebula-netavark/network.Build={{.COMMIT}}" ./cmd/nebula-netavarkd
      - go build ./cmd/nebula-netavark-plugin

  test:
    desc: Runs unprivileged Go regression tests
    cmds:
      - go test ./...

  test:e2e:
    desc: Builds binaries and runs IPv6 end-to-end tests with rootful Podman
    deps: [build]
    cmds:
      - sudo bash tests/e2e.sh {{.CLI_ARGS}}
